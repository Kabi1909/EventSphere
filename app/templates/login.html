{% extends "base.html" %}
{% block content %}
<style>
  .auth-card {
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    overflow: hidden;
    background-color: #ffffff;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
  }
  .auth-header {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #2563eb 100%);
    color: #ffffff;
    padding: 2rem 2rem 1.75rem 2rem;
    position: relative;
    overflow: hidden;
  }
  .auth-header::after {
    content: "";
    position: absolute;
    top: -40%;
    right: -15%;
    width: 240px;
    height: 240px;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.3) 0%, rgba(37, 99, 235, 0) 70%);
    pointer-events: none;
  }
  .field-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #334155;
    margin-bottom: 0.4rem;
    display: block;
  }
  .auth-input-group .input-group-text {
    background-color: #f8fafc;
    border: 1.5px solid #cbd5e1;
    border-right: none;
    border-radius: 10px 0 0 10px;
    color: #64748b;
  }
  .auth-input-group .form-control {
    background-color: #f8fafc;
    border: 1.5px solid #cbd5e1;
    border-left: none;
    border-radius: 0 10px 10px 0;
    padding: 0.65rem 0.9rem 0.65rem 0.25rem;
    color: #0f172a;
  }
  .auth-input-group:focus-within .input-group-text,
  .auth-input-group:focus-within .form-control {
    background-color: #ffffff;
    border-color: #2563eb;
    box-shadow: none;
  }
  .auth-input-group:focus-within {
    border-radius: 10px;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
  }
  .btn-es-primary {
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    padding: 0.68rem 1.2rem;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.28);
    transition: all 0.18s ease;
  }
  .btn-es-primary:hover {
    background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
    color: #ffffff;
    transform: translateY(-1px);
  }
</style>

<div class="row justify-content-center py-3">
  <div class="col-12 col-sm-10 col-md-6 col-lg-5">
    <div class="auth-card">
      <div class="auth-header">
        <span class="badge bg-white bg-opacity-10 border border-white border-opacity-25 rounded-pill px-3 py-1 mb-2 small">
          <i class="bi bi-shield-lock me-1"></i> EventSphere MAS Access
        </span>
        <h4 class="fw-bold mb-1">Sign In to EventSphere</h4>
        <p class="small text-light opacity-75 mb-0">Access your digital QR tickets, venue bookings, or dashboard</p>
      </div>

      <div class="p-4">
        <form method="post" action="/login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

          <div class="mb-3">
            <label class="field-label">Email Address</label>
            <div class="input-group auth-input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="you@eventsphere.edu" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="field-label">Password</label>
            <div class="input-group auth-input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-es-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
          New to EventSphere?
          <a href="/register" class="text-primary fw-semibold text-decoration-none">Create an attendee account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
